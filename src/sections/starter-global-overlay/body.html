{% if form_notice %}
  <aside
    class="starter starter-flash{% if form_notice.success %} starter-flash--success{% else %} starter-flash--error{% endif %}"
    aria-live="polite"
  >
    <p>{{ form_notice.message }}</p>
  </aside>
{% endif %}
<aside class="starter starter-flash starter-feedback" data-starter-feedback hidden
  data-cart-add="{{ 'added_to_cart' | t }}"
  data-cart-update="{{ 'cart_updated' | t }}"
  data-wishlist-update="{{ 'wishlist_updated' | t }}">
  <div>
    <p data-starter-feedback-message role="status" aria-live="polite" aria-atomic="true"></p>
    <a data-starter-feedback-cart href="{{ routes.cart_url }}" hidden>{{ 'view_cart' | t }}</a>
    <a data-starter-feedback-wishlist href="{{ routes.wishlist_url }}" hidden>{{ 'view_wishlist' | t }}</a>
  </div>
  <button type="button" class="starter-feedback__dismiss" data-starter-feedback-dismiss aria-label="{{ 'dismiss' | t }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
  </button>
</aside>
<script>
(function () {
  "use strict";
  var ready = "data-starter-feedback-ready";
  if (document.documentElement.hasAttribute(ready)) return;
  document.documentElement.setAttribute(ready, "");

  // Preserve the shopper's variant and quantity while using the confirmed
  // saved state returned by the hosted action for this product-only form.
  document.addEventListener("tf:action-success", function (event) {
    var detail = event.detail;
    if (!detail || detail.action !== "wishlist_toggle" || !detail.form) return;
    var button = detail.form.querySelector("[data-starter-wishlist-toggle]");
    var result = detail.result;
    var state = result && result.product_session_state && result.product_session_state.product;
    var saved = state && state.wishlist && state.wishlist.direct_saved;
    if (!button || typeof saved !== "boolean") return;
    button.textContent = button.getAttribute(saved ? "data-remove-label" : "data-save-label");
  });

  // The hosted bridge owns the request. This listener only presents its result.
  document.addEventListener("tf:action-done", function (event) {
    var action = event.detail && event.detail.action;
    var cart = action === "cart_add" || action === "cart_update";
    var wishlist = action === "wishlist_add" || action === "wishlist_remove" || action === "wishlist_toggle";
    if (!cart && !wishlist) return;
    var notice = document.querySelector("[data-starter-feedback]");
    if (!notice) return;
    var message = notice.querySelector("[data-starter-feedback-message]");
    var key = action === "cart_add" ? "data-cart-add" : cart ? "data-cart-update" : "data-wishlist-update";
    message.textContent = notice.getAttribute(key);
    notice.querySelector("[data-starter-feedback-cart]").hidden = !cart;
    notice.querySelector("[data-starter-feedback-wishlist]").hidden = !wishlist;
    notice.hidden = false;
  });

  document.addEventListener("tf:action-start", function () {
    var notice = document.querySelector("[data-starter-feedback]");
    if (notice) notice.hidden = true;
  });

  document.addEventListener("click", function (event) {
    var dismiss = event.target.closest && event.target.closest("[data-starter-feedback-dismiss]");
    if (dismiss) dismiss.closest("[data-starter-feedback]").hidden = true;
  });

  // Back-in-stock forms (product page and sold-out cart lines): email or text, then the store's own reply.
  // The phone field checks its own number.

  function notifyBox(node) {
    return node && node.closest && node.closest("[data-starter-notify]");
  }

  function notifyMessage(result) {
    result = result || {};
    var errors = (result.user_errors || []).map(function (error) { return error && error.message; }).filter(Boolean);
    if (errors.length) return errors.join(" ");
    if (typeof result.response === "string") return result.response;
    return (result.response && result.response.message) || result.message || "";
  }

  function notifySay(box, text, ok) {
    var node = box.querySelector("[data-starter-notify-message]");
    node.textContent = text;
    node.hidden = !text;
    node.classList.toggle("is-error", !ok);
  }

  function notifyKind(box) {
    var kind = box.querySelector("[data-starter-notify-kind]:checked");
    var sms = !!kind && kind.value === "sms";
    Array.prototype.forEach.call(box.querySelectorAll("[data-starter-notify-field]"), function (field) {
      var on = field.getAttribute("data-starter-notify-field") === (sms ? "sms" : "email");
      field.hidden = !on;
      Array.prototype.forEach.call(field.querySelectorAll("input"), function (input) {
        input.disabled = !on;
      });
    });
  }

  document.addEventListener("change", function (event) {
    if (event.target.hasAttribute && event.target.hasAttribute("data-starter-notify-kind")) notifyKind(notifyBox(event.target));
  });

  document.addEventListener("submit", function (event) {
    var box = notifyBox(event.target);
    if (!box) return;
    if (!event.target.checkValidity()) {
      event.preventDefault();
      event.stopImmediatePropagation();
      event.target.reportValidity();
    }
  }, true);

  document.addEventListener("tf:action-success", function (event) {
    var detail = event.detail || {};
    var box = detail.action === "cart_notify_me" && notifyBox(detail.form);
    if (!box) return;
    // A redrawn section is found again by the form's id.
    if (!box.isConnected && box.id) box = document.getElementById(box.id);
    if (!box) return;
    var form = box.querySelector("form");
    if (form) form.hidden = true;
    notifySay(box, notifyMessage(detail.result) || box.getAttribute("data-saved"), true);
  });

  document.addEventListener("tf:action-error", function (event) {
    var detail = event.detail || {};
    var box = detail.action === "cart_notify_me" && notifyBox(detail.form);
    if (!box) return;
    event.preventDefault();
    notifySay(box, notifyMessage(detail.result) || box.getAttribute("data-failed"), false);
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-starter-notify]"), notifyKind);
})();
</script>
{% if form_error %}
  <aside class="starter starter-flash starter-flash--error" role="alert">
    <p>{{ form_error.message }}</p>
  </aside>
{% endif %}
