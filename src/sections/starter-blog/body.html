<article class="starter starter-section starter-article">
  <div class="starter-shell">
    <header class="starter-article__header">
      {% if settings.show_author and blog_post.author_name %}
        <p class="starter-eyebrow">{{ blog_post.author_name }}</p>
      {% endif %}
      <h1 class="starter-heading">{{ blog_post.title }}</h1>
      {% if blog_post.excerpt %}
        <p class="starter-subheading">{{ blog_post.excerpt }}</p>
      {% endif %}
    </header>
    {% if blog_post.featured_image %}
      <img
        class="starter-article__hero"
        src="{{ blog_post.featured_image.url | image_url: width: 1600 }}"
        alt="{{ blog_post.title }}"
       srcset="{{ blog_post.featured_image.url | image_srcset: max: 2048 }}" sizes="(min-width: 701px) calc(min(100vw - clamp(2rem, 6vw, 6rem), {{ theme.settings.content_width | default: 1248 }}px)), calc(min(100vw - 1.5rem, {{ theme.settings.content_width | default: 1248 }}px))" {{ blog_post.featured_image.url | image_loading }}>
    {% endif %}
    <div class="starter-richtext starter-article__content">{{ blog_post.content }}</div>
  </div>
</article>
