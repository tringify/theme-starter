<main class="starter starter-system" data-tf-field="unavailable">
  <div class="starter-system__inner">
    <p class="starter-eyebrow">{{ shop.name }}</p>
    <h1 class="starter-heading" data-tf-field="title">{{ settings.title }}</h1>
    <p class="starter-subheading" data-tf-field="message">{{ settings.message }}</p>
    <a class="starter-button" href="" data-tf-field="retry_label">{{ settings.retry_label }}</a>
  </div>
</main>
