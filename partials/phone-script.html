<script>
(function () {
  "use strict";
  // Phone fields ([data-starter-phone]): a country button (flag and calling code) opens a searchable list of the
  // store's phone countries. The visible field then takes the national number and a hidden field sends one E.164
  // number (+ and digits) under the original name. A number typed or pasted with + or 00 moves to its country.
  // Without this script, or without countries, the field itself is sent and takes a full + number.
  var ready = "data-starter-phone-ready";
  if (document.documentElement.hasAttribute(ready)) return;
  document.documentElement.setAttribute(ready, "");

  // Countries sharing a calling code: a number goes to the code's main country unless the current or default one shares it.
  var MAIN = { "1": "US", "7": "RU", "39": "IT", "44": "GB", "47": "NO", "61": "AU", "212": "MA", "262": "RE", "290": "SH", "358": "FI", "590": "GP", "599": "CW" };
  // National prefixes the international number drops: [prefix, national length after it (0: any)]. Most countries
  // use a single 0; these keep their leading 0 (it is part of the number) or use another prefix.
  var TRUNK = { IT: null, SM: null, VA: null, CI: null, CG: null, GA: null, HU: ["06", 0], RU: ["8", 10], KZ: ["8", 10], BY: ["80", 9], LT: ["8", 8], TM: ["8", 8], TJ: ["8", 9] };
  var E164 = /^\+[1-9]\d{6,14}$/;
  var TOP = typeof HTMLElement !== "undefined" && typeof HTMLElement.prototype.showPopover === "function";
  var lists = {};
  var openField = null;

  function digits(text) {
    return String(text || "").replace(/\D/g, "");
  }

  function fold(text) {
    return String(text || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }

  function flagOf(country) {
    if (country.flag) return country.flag;
    var iso = String(country.iso_code || "").toUpperCase();
    return /^[A-Z]{2}$/.test(iso) ? String.fromCodePoint(0x1f1e6 + iso.charCodeAt(0) - 65, 0x1f1e6 + iso.charCodeAt(1) - 65) : "";
  }

  // Fields on one page share one list; it is parsed and sorted once, by name in the page language.
  function countriesOf(root) {
    var raw = root.getAttribute("data-countries") || "[]";
    if (lists[raw]) return lists[raw];
    var list = [];
    try {
      list = JSON.parse(raw) || [];
    } catch (error) {}
    list = list.filter(function (country) {
      return country && country.iso_code && country.name && /^\+\d+$/.test(country.dial_code || "");
    });
    var collator = window.Intl && Intl.Collator ? new Intl.Collator(document.documentElement.lang || undefined, { sensitivity: "base" }) : null;
    list.sort(function (a, b) {
      return collator ? collator.compare(a.name, b.name) : a.name < b.name ? -1 : 1;
    });
    lists[raw] = list;
    return list;
  }

  // "+44 (0)7700 900123" or "0044 7700 900123" -> { country: GB, rest: "7700900123" }. While the code is still
  // being typed (a longer code could match, or nothing follows it) it waits, unless final.
  function detect(field, text, final) {
    var compact = String(text || "").replace(/\(0\)/g, "").replace(/[^0-9+]/g, "");
    var international = compact.charAt(0) === "+" ? compact.slice(1) : /^00/.test(compact) ? compact.slice(2) : null;
    if (international === null) return null;
    var number = digits(international);
    var best = null;
    var bestLength = 0;
    if (!final && field.list.some(function (country) {
      var code = digits(country.dial_code);
      return code.length > number.length && code.indexOf(number) === 0;
    })) return null;
    function rank(country, code) {
      return country === field.current ? 3 : country === field.start ? 2 : MAIN[code] === country.iso_code ? 1 : 0;
    }
    field.list.forEach(function (country) {
      var code = digits(country.dial_code);
      if (!code || number.indexOf(code) !== 0 || code.length < bestLength) return;
      if (code.length > bestLength || rank(country, code) > rank(best, code)) {
        best = country;
        bestLength = code.length;
      }
    });
    if (!best) return null;
    var rest = number.slice(bestLength);
    if (!final && !rest) return null;
    return { country: best, rest: rest };
  }

  function national(country, number) {
    var trunk = TRUNK.hasOwnProperty(country.iso_code) ? TRUNK[country.iso_code] : digits(country.dial_code) === "1" ? ["1", 10] : ["0", 0];
    if (trunk && number.indexOf(trunk[0]) === 0 && (!trunk[1] || number.length === trunk[0].length + trunk[1])) return number.slice(trunk[0].length);
    return number;
  }

  function e164(field) {
    var compact = String(field.number.value || "").replace(/\(0\)/g, "").replace(/[^0-9+]/g, "");
    var number = digits(compact);
    if (!number) return "";
    if (compact.charAt(0) === "+") return "+" + number;
    if (/^00/.test(compact)) return "+" + number.slice(2);
    return field.current.dial_code + national(field.current, number);
  }

  // The sent value follows the visible number; a number that cannot be a phone number is caught before sending.
  function sync(field) {
    var value = e164(field);
    field.value.value = value;
    field.number.setCustomValidity(value && !E164.test(value) ? field.root.getAttribute("data-invalid") || "" : "");
  }

  function load(field, text) {
    var hit = detect(field, text, true);
    if (hit) {
      field.current = hit.country;
      field.number.value = hit.rest;
    } else {
      field.number.value = String(text || "").trim();
    }
  }

  function setup(root) {
    if (root.starterPhone !== undefined) return root.starterPhone;
    root.starterPhone = null;
    var list = countriesOf(root);
    if (!list.length) return null;
    var field = {
      root: root,
      list: list,
      number: root.querySelector("[data-starter-phone-number]"),
      value: root.querySelector("[data-starter-phone-value]"),
      button: root.querySelector("[data-starter-phone-country]"),
      picker: root.querySelector("[data-starter-phone-picker]"),
      search: root.querySelector("[data-starter-phone-search]"),
      options: root.querySelector("[data-starter-phone-list]"),
      row: root.querySelector("[data-starter-phone-row]"),
      single: list.length === 1,
      shown: [],
      active: -1
    };
    var wanted = String(root.getAttribute("data-default") || "").toUpperCase();
    field.start = list.filter(function (country) { return country.iso_code === wanted; })[0] || list[0];
    field.current = field.start;
    // Setting a hidden input's value rewrites its default, so the saved number is kept for a form reset.
    field.saved = field.value.getAttribute("value") || field.number.getAttribute("value") || "";
    load(field, field.saved);
    // From here the visible field holds the national number and the hidden one is sent.
    field.value.name = field.value.getAttribute("data-name");
    field.number.removeAttribute("name");
    field.number.removeAttribute("pattern");
    field.number.removeAttribute("title");
    if (field.number.getAttribute("autocomplete") === "tel") field.number.setAttribute("autocomplete", "tel-national");
    if (field.single || !field.picker) {
      // One country is a fixed prefix, read with the number.
      var fixed = root.querySelector("[data-starter-phone-fixed]");
      fixed.hidden = false;
      if (field.button) field.button.remove();
      field.button = null;
      field.number.setAttribute("aria-describedby", (fixed.id + " " + (field.number.getAttribute("aria-describedby") || "")).trim());
    } else {
      field.button.hidden = false;
      if (TOP) {
        field.picker.setAttribute("popover", "manual");
        field.picker.hidden = false;
      }
    }
    root.classList.add("is-enhanced");
    root.starterPhone = field;
    choose(field, field.current, false);
    return field;
  }

  function choose(field, country, focus) {
    field.current = country;
    var root = field.root;
    var selected = (root.getAttribute("data-label-selected") || "").replace("__COUNTRY__", country.name + " (" + country.dial_code + ")");
    Array.prototype.forEach.call(root.querySelectorAll("[data-starter-phone-flag]"), function (node) { node.textContent = flagOf(country); });
    Array.prototype.forEach.call(root.querySelectorAll("[data-starter-phone-dial]"), function (node) { node.textContent = country.dial_code; });
    Array.prototype.forEach.call(root.querySelectorAll("[data-starter-phone-selected]"), function (node) { node.textContent = selected; });
    var hint = root.querySelector("[data-starter-phone-hint]");
    if (hint) {
      hint.textContent = country.example ? (root.getAttribute("data-label-example") || "").replace("__EXAMPLE__", country.example) : "";
      hint.hidden = !country.example;
    }
    if (country.example) field.number.setAttribute("placeholder", country.example);
    else field.number.removeAttribute("placeholder");
    sync(field);
    if (focus) field.number.focus();
  }

  function render(field) {
    var raw = field.search.value.trim();
    var query = fold(raw);
    var queryDigits = digits(raw);
    var word = new RegExp("[\\s(\\-]" + query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    // Names starting with the search come first, then names with a word starting with it, then the rest.
    function rank(country) {
      var name = fold(country.name);
      if (country.iso_code.toLowerCase() === query || name.indexOf(query) === 0) return 0;
      return word.test(name) ? 1 : 2;
    }
    field.shown = field.list.filter(function (country) {
      return !raw || fold(country.name).indexOf(query) !== -1 || country.iso_code.toLowerCase() === query || (queryDigits && digits(country.dial_code).indexOf(queryDigits) === 0);
    });
    if (query && !queryDigits) {
      field.shown = field.shown
        .map(function (country, index) { return [rank(country), index, country]; })
        .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; })
        .map(function (entry) { return entry[2]; });
    }
    var fragment = document.createDocumentFragment();
    field.shown.forEach(function (country) {
      var option = document.createElement("li");
      option.id = field.options.id + "-" + country.iso_code;
      option.className = "starter-phone__option" + (country === field.current ? " is-current" : "");
      option.setAttribute("role", "option");
      option.setAttribute("aria-selected", "false");
      option.setAttribute("data-iso", country.iso_code);
      var flag = document.createElement("span");
      flag.className = "starter-phone__flag";
      flag.setAttribute("aria-hidden", "true");
      flag.textContent = flagOf(country);
      var name = document.createElement("span");
      name.className = "starter-phone__name";
      name.textContent = country.name;
      var dial = document.createElement("bdi");
      dial.className = "starter-phone__option-dial";
      dial.setAttribute("dir", "ltr");
      dial.textContent = country.dial_code;
      option.appendChild(flag);
      option.appendChild(name);
      option.appendChild(dial);
      fragment.appendChild(option);
    });
    field.options.replaceChildren(fragment);
    var empty = field.root.querySelector("[data-starter-phone-empty]");
    empty.textContent = field.shown.length ? "" : empty.getAttribute("data-text");
    var at = raw ? 0 : field.shown.indexOf(field.current);
    activate(field, field.shown.length ? Math.max(0, at) : -1);
  }

  function activate(field, index) {
    var options = field.options.children;
    field.active = index;
    for (var i = 0; i < options.length; i++) {
      options[i].setAttribute("aria-selected", i === index ? "true" : "false");
      options[i].classList.toggle("is-active", i === index);
    }
    if (index >= 0 && options[index]) {
      field.search.setAttribute("aria-activedescendant", options[index].id);
      options[index].scrollIntoView({ block: "nearest" });
    } else {
      field.search.removeAttribute("aria-activedescendant");
    }
  }

  // In the top layer the list is never clipped by a panel or drawer. It opens under the field, or above it when
  // there is more room there, at least 18rem wide and kept inside the window on the field's starting edge.
  function place(field) {
    if (!TOP) return;
    var rect = field.row.getBoundingClientRect();
    var height = window.innerHeight;
    var width = document.documentElement.clientWidth;
    var below = height - rect.bottom - 12;
    var above = rect.top - 12;
    var up = below < 260 && above > below;
    var size = Math.min(Math.max(rect.width, 288), width - 16);
    var x = getComputedStyle(field.root).direction === "rtl" ? rect.right - size : rect.left;
    var style = field.picker.style;
    style.left = Math.min(Math.max(8, x), width - 8 - size) + "px";
    style.width = size + "px";
    if (up) {
      style.top = "auto";
      style.bottom = height - rect.top + 6 + "px";
    } else {
      style.bottom = "auto";
      style.top = rect.bottom + 6 + "px";
    }
    style.setProperty("--starter-phone-room", Math.max(140, (up ? above : below) - 80) + "px");
  }

  function isOpen(field) {
    return !!field && (TOP ? field.picker.matches(":popover-open") : !field.picker.hidden);
  }

  function open(field) {
    if (openField && openField !== field) close(openField, false);
    openField = field;
    field.button.setAttribute("aria-expanded", "true");
    if (TOP) {
      field.picker.showPopover();
      place(field);
    } else {
      field.picker.hidden = false;
    }
    field.search.value = "";
    render(field);
    field.search.focus();
  }

  function close(field, back) {
    if (!isOpen(field)) return;
    if (TOP) field.picker.hidePopover();
    else field.picker.hidden = true;
    field.button.setAttribute("aria-expanded", "false");
    if (openField === field) openField = null;
    if (back) field.button.focus();
  }

  function fieldOf(node) {
    var root = node && node.closest && node.closest("[data-starter-phone]");
    return root ? setup(root) : null;
  }

  document.addEventListener("click", function (event) {
    var button = event.target.closest && event.target.closest("[data-starter-phone-country]");
    if (button) {
      var field = fieldOf(button);
      if (field) {
        if (isOpen(field)) close(field, true);
        else open(field);
      }
      return;
    }
    var option = event.target.closest && event.target.closest(".starter-phone__option");
    if (option) {
      var owner = fieldOf(option);
      var country = owner && owner.list.filter(function (entry) { return entry.iso_code === option.getAttribute("data-iso"); })[0];
      if (country) {
        close(owner, false);
        choose(owner, country, true);
      }
      return;
    }
    if (openField && !openField.root.contains(event.target)) close(openField, false);
  });

  document.addEventListener("input", function (event) {
    var target = event.target;
    if (!target.hasAttribute) return;
    if (target.hasAttribute("data-starter-phone-search")) {
      var field = fieldOf(target);
      if (field) render(field);
      return;
    }
    if (target.hasAttribute("data-starter-phone-number")) {
      var owner = fieldOf(target);
      if (!owner) return;
      var hit = !owner.single && detect(owner, owner.number.value, false);
      if (hit) {
        owner.number.value = hit.rest;
        choose(owner, hit.country, false);
      } else {
        sync(owner);
      }
    }
  });

  document.addEventListener("focusout", function (event) {
    if (!event.target.hasAttribute || !event.target.hasAttribute("data-starter-phone-number")) return;
    var field = fieldOf(event.target);
    var hit = field && !field.single && detect(field, field.number.value, true);
    if (hit) {
      field.number.value = hit.rest;
      choose(field, hit.country, false);
    }
  });

  // Escape closes only the list: caught on the window before a drawer or dialog sees it.
  window.addEventListener("keydown", function (event) {
    if (event.key !== "Escape" || !openField || !openField.root.contains(event.target)) return;
    event.preventDefault();
    event.stopPropagation();
    close(openField, true);
  }, true);

  document.addEventListener("keydown", function (event) {
    if (!event.target.hasAttribute || !event.target.hasAttribute("data-starter-phone-search")) return;
    var field = fieldOf(event.target);
    if (!field) return;
    var count = field.shown.length;
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (count) activate(field, (field.active + 1) % count);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      if (count) activate(field, (field.active - 1 + count) % count);
    } else if (event.key === "Home" && count) {
      event.preventDefault();
      activate(field, 0);
    } else if (event.key === "End" && count) {
      event.preventDefault();
      activate(field, count - 1);
    } else if (event.key === "Enter") {
      event.preventDefault();
      var country = field.shown[field.active];
      if (country) {
        close(field, false);
        choose(field, country, true);
      }
    } else if (event.key === "Tab") {
      close(field, false);
    }
  });

  window.addEventListener("resize", function () { if (openField) place(openField); });
  window.addEventListener("scroll", function () { if (openField) place(openField); }, { capture: true, passive: true });

  // The sent value is current at submit, whatever changed the number (autofill included). Capture runs before
  // the hosted bridge and the theme's own form checks read the form.
  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!form || !form.querySelectorAll) return;
    Array.prototype.forEach.call(form.querySelectorAll("[data-starter-phone]"), function (root) {
      var field = setup(root);
      if (field) sync(field);
    });
  }, true);

  // A reset form goes back to its saved number (or none), under that number's country.
  document.addEventListener("reset", function (event) {
    var form = event.target;
    if (!form || !form.querySelectorAll) return;
    setTimeout(function () {
      Array.prototype.forEach.call(form.querySelectorAll("[data-starter-phone]"), function (root) {
        var field = setup(root);
        if (!field) return;
        field.current = field.start;
        load(field, field.saved);
        choose(field, field.current, false);
      });
    });
  }, true);

  function all() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-starter-phone]"), setup);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", all);
  else all();
  // Sections redrawn after a hosted action bring new fields.
  var frame = 0;
  new MutationObserver(function () {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(all);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
